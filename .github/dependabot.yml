version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    # Reaches the formatter build via includeBuild, so every build file is fetched exactly once.
    directory: /buildtools
    schedule:
      interval: weekly
    groups:
      gradle-deps:
        patterns:
          - "*"

  - package-ecosystem: gradle
    # Only the root holds the Gradle wrapper; dependencies are covered via /buildtools.
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: gradle-wrapper
