version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    # Each composite build is scanned separately; the root holds the shared Gradle wrapper.
    directories:
      - /
      - /formatter
      - /buildtools
    schedule:
      interval: monthly
    groups:
      gradle-deps:
        patterns:
          - "*"
